[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rupiv-sdk"
version = "0.1.0"
description = "Python SDK for Rupiv.ai outcome-based billing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0,<1.0",
    "pydantic>=2.0.0,<3.0",
]

[project.urls]
Homepage = "https://rupiv.ai"
Documentation = "https://docs.rupiv.ai"
Repository = "https://github.com/rupiv/rupiv-python"

[tool.hatch.build.targets.wheel]
packages = ["rupiv"]
