services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rupiv-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://rupiv:rupiv@postgres:5432/rupiv"
      REDIS_URL: "redis://redis:6379/0"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "rupiv"
      APP_ENV: "development"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rupiv-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rupiv-worker
    command: ["python", "-m", "rupiv.workers.event_processor"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://rupiv:rupiv@postgres:5432/rupiv"
      REDIS_URL: "redis://redis:6379/0"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "rupiv"
      APP_ENV: "development"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import rupiv; print(\"ok\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - rupiv-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: rupiv-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rupiv
      POSTGRES_PASSWORD: rupiv
      POSTGRES_DB: rupiv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupiv -d rupiv"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rupiv-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: rupiv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rupiv-network
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: rupiv-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init_clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rupiv-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:

networks:
  rupiv-network:
    driver: bridge
