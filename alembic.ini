# Alembic configuration for Rupiv.ai

[alembic]
# Path to migration scripts, relative to project root.
script_location = src/migrations

# Template used to generate migration files.
# file_template = %%(rev)s_%%(slug)s

# Async SQLAlchemy URL — overridden by DATABASE_URL env var in env.py.
sqlalchemy.url = postgresql+asyncpg://rupiv:rupiv@localhost:5432/rupiv

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
