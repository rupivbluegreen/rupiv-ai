name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system -e "."
          uv pip install --system ruff pyright

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system -e "."
          uv pip install --system --group dev

      - name: Run tests
        run: pytest tests/ -x --tb=short --cov=src/rupiv --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  frontend:
    name: Frontend
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/
          retention-days: 14

  docker:
    name: Docker
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rupiv-api:ci .

      - name: Start container
        run: |
          docker run -d \
            --name rupiv-ci \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:/// \
            -e REDIS_URL=redis://localhost:6379 \
            -e CLICKHOUSE_URL=http://localhost:8123 \
            -e APP_SECRET_KEY=ci-test \
            rupiv-api:ci

      - name: Wait for startup
        run: sleep 5

      - name: Health check
        run: curl -f http://localhost:8000/health || exit 1

      - name: Clean up
        if: always()
        run: |
          docker stop rupiv-ci || true
          docker rm rupiv-ci || true
