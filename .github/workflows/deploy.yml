name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -sf "${{ secrets.RENDER_DEPLOY_HOOK }}" || {
            echo "Deploy hook failed — is RENDER_DEPLOY_HOOK secret set?"
            exit 1
          }
